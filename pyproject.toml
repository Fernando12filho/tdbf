[project]
name = "tdbf"
version = "0.1.0"
description = "Test-Driven Bug Fixing — Phase 1 (test generation)"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["swebench", "datasets", "anthropic", "openai"]
webapp = ["flask"]

[tool.setuptools.packages.find]
where = ["src"]
