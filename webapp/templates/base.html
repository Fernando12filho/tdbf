<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TDBF{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">TDBF</a>
      <div class="d-flex gap-3">
        <a class="nav-link text-white" href="/">Dashboard</a>
        <a class="nav-link text-white" href="/results">Results</a>
        <a class="nav-link text-white" href="/swt">SWT-bench</a>
        <a class="nav-link text-white" href="/development">Development</a>
        <a class="nav-link text-white" href="/status">Status</a>
        <a class="nav-link text-white" href="/research">Research</a>
        <a class="nav-link text-white" href="/runs">Runs</a>
        <a class="nav-link text-white" href="/docs">Docs</a>
        <a class="nav-link text-white" href="/commands">Commands</a>
      </div>
    </div>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
